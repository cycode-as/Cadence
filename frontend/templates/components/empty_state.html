{% macro render_empty(title="No records found", description="There is nothing to display right now.", action_href=None, action_label=None) %}
<div class="cadence-card p-8 text-center max-w-md mx-auto my-6">
  <div class="w-12 h-12 mx-auto rounded-full bg-[var(--cadence-khaki-light)] border border-[var(--cadence-khaki)] flex items-center justify-center text-[var(--cadence-olive)] mb-3">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M20 13V7a2 2 0 00-2-2H6a2 2 0 00-2 2v6m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-4.586a1 1 0 00-.707.293l-1.414 1.414a1 1 0 01-.707.293h-2.586a1 1 0 01-.707-.293L8.293 13.293A1 1 0 007.586 13H4" />
    </svg>
  </div>
  <h3 class="text-base font-semibold">{{ title }}</h3>
  <p class="text-sm text-[var(--cadence-muted)] mt-1">{{ description }}</p>
  {% if action_href and action_label %}
  <div class="mt-4">
    <a href="{{ action_href }}" class="btn btn-sm btn-cadence">{{ action_label }}</a>
  </div>
  {% endif %}
</div>
{% endmacro %}
