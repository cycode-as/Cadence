{% macro render_chart_card(chart_id, title, subtitle="", chart_config=None, height_class="h-64", drill_endpoint=None) %}
<section class="cadence-card p-5 flex flex-col gap-3" aria-labelledby="{{ chart_id }}-title">
  <div class="flex flex-wrap items-start justify-between gap-2">
    <div>
      <h2 id="{{ chart_id }}-title" class="text-base font-bold">{{ title }}</h2>
      {% if subtitle %}
      <p class="text-xs text-[var(--cadence-muted)] mt-0.5">{{ subtitle }}</p>
      {% endif %}
    </div>
    <span class="badge badge-xs badge-khaki">Live</span>
  </div>

  <div class="relative w-full {{ height_class }}">
    <canvas
      id="{{ chart_id }}"
      data-cadence-chart="true"
      {% if drill_endpoint %}data-drill-endpoint="{{ drill_endpoint }}"{% endif %}
      aria-label="{{ title }}"
      role="img"
    ></canvas>
  </div>

  {% if chart_config is not none %}
  <script type="application/json" id="{{ chart_id }}-data">
    {{ chart_config | tojson }}
  </script>
  {% endif %}
</section>
{% endmacro %}
