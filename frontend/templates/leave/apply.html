{% extends "base.html" %}
{% block title %}Apply Leave — CADENCE{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-6 max-w-2xl">
  <h1 class="text-2xl font-bold mb-6">Apply for Leave</h1>
  <form class="cadence-card p-6" hx-post="/api/leave" hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <div class="grid gap-4">
      <div>
        <label class="label"><span class="label-text">From Date</span></label>
        <input type="date" name="from_date" class="input input-bordered w-full" required />
      </div>
      <div>
        <label class="label"><span class="label-text">To Date</span></label>
        <input type="date" name="to_date" class="input input-bordered w-full" required />
      </div>
      <div>
        <label class="label"><span class="label-text">Reason</span></label>
        <textarea name="reason" class="textarea textarea-bordered w-full" rows="4" required></textarea>
      </div>
      <div class="flex justify-end gap-3">
        <a href="/leave" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-cadence">Submit Leave Request</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
