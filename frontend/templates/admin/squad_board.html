{% extends "base.html" %}
{% block title %}Squad Board — CADENCE{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-6">
  <h1 class="text-2xl font-bold mb-6">Squad Management Board</h1>
  <div class="grid md:grid-cols-3 gap-4">
    {% for squad in squads %}
    <div class="cadence-card p-4">
      <h3 class="font-semibold mb-3">{{ squad.name }}</h3>
      <div id="squad-{{ squad.id }}" class="sortable-list space-y-2 min-h-32">
        {% for cadet in squad.cadets %}
        <div class="bg-base-200 p-2 rounded cursor-move" data-cadet-id="{{ cadet.id }}">
          <span class="text-sm font-medium">{{ cadet.full_name }}</span>
          <span class="text-xs text-[var(--cadence-muted)]">({{ cadet.rank }})</span>
        </div>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</div>
<script src="/static/js/dnd.js"></script>
{% endblock %}
