{% extends "base.html" %}
{% block title %}Import Cadets — CADENCE{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-6 max-w-4xl">
  <h1 class="text-2xl font-bold mb-6">Import Cadets from CSV</h1>
  <div class="cadence-card p-6">
    <form hx-post="/api/cadets/import" hx-encoding="multipart/form-data">
      <div class="border-2 border-dashed border-base-300 rounded-lg p-12 text-center">
        <input type="file" name="file" accept=".csv" class="file-input file-input-bordered w-full max-w-xs" />
        <p class="text-sm text-[var(--cadence-muted)] mt-2">Upload CSV with cadet data</p>
      </div>
      <div class="mt-6 flex gap-3 justify-end">
        <a href="/admin/roster" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-cadence">Upload & Import</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
