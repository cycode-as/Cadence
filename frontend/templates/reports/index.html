{% extends "base.html" %}
{% block title %}Reports — CADENCE{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-6 max-w-4xl">
  <h1 class="text-2xl font-bold mb-6">Unit Reports</h1>
  <form class="cadence-card p-6 mb-6">
    <div class="grid md:grid-cols-3 gap-4">
      <div>
        <label class="label"><span class="label-text">From Date</span></label>
        <input type="date" name="from" class="input input-bordered w-full" />
      </div>
      <div>
        <label class="label"><span class="label-text">To Date</span></label>
        <input type="date" name="to" class="input input-bordered w-full" />
      </div>
      <div>
        <label class="label"><span class="label-text">Level</span></label>
        <select name="level" class="select select-bordered w-full">
          <option value="battalion">Battalion</option>
          <option value="contingent">Contingent</option>
          <option value="company">Company</option>
          <option value="squad">Squad</option>
        </select>
      </div>
    </div>
    <div class="mt-6 flex gap-3">
      <a href="/api/reports/attendance?format=csv" class="btn btn-outline">Download Attendance CSV</a>
      <a href="/api/reports/leave-stats?format=csv" class="btn btn-outline">Download Leave Stats CSV</a>
    </div>
  </form>
</div>
{% endblock %}
